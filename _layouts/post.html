---
layout: default
---

<article class="post">

  <header class="page-header">
    <div class="page-header-inner">
      <h1>{{ page.title }}</h1>
      <p class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        {% if page.tags.size > 0 %}
          {% for tag in page.tags %}<span class="post-tag">{{ tag | replace: '-', ' ' }}</span>{% endfor %}
        {% endif %}
      </p>
    </div>
  </header>

  <div class="page-section">

    <div class="post-content">
      {{ content }}
    </div>

    <footer class="post-footer">
      <a href="{{ '/writing' | relative_url }}">&larr; All writing</a>
    </footer>

  </div>

</article>
