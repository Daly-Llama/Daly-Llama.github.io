# ============================================================
#  SITE CONFIGURATION  —  _config.yml
# ============================================================
#  Edit the values below. After saving, GitHub Pages rebuilds
#  your site automatically (usually within 30–60 seconds).
# ============================================================

# --- Your name and site description ---
title:       "Dallin Nielson"
tagline:     "Data Scientist · KCS Specialist"
description: "Applied machine learning and writing on Knowledge Centered Service, knowledge systems, and human-centered AI."

# --- Your live site URL ---
url:         "https://dallinnielson.com"
baseurl:     ""   # Leave blank unless your repo is at yourusername.github.io/reponame

# --- Your contact links (used in the footer automatically) ---
email:       "dallin.nielson@gmail.com"
linkedin:    "https://www.linkedin.com/in/dallin-nielson"
github:      "https://github.com/Daly-Llama"

# ============================================================
#  ARTICLE URLs
# ============================================================
#  Every post lives at /writing/<slug>/ — no dates, no .html.
#  The slug comes from the FILENAME, not the title, so you can
#  rewrite a headline any time without breaking the link.
#
#  DO NOT CHANGE THIS after publishing — it would break the
#  URL of every article already out in the world.
# ============================================================
permalink: /writing/:title/

# --- Defaults applied to every post automatically ---
#     (so you never type "layout: post" in front matter)
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# --- Jekyll settings ---
markdown:    kramdown
kramdown:
  input: GFM
  hard_wrap: false
timezone:    America/Chicago

plugins:
  - jekyll-feed      # generates /feed.xml
  - jekyll-seo-tag   # canonical tags + Open Graph link previews
  - jekyll-sitemap   # generates /sitemap.xml for Search Console
